cli.publish.long: "Publish a component to the Market.\n\nWhat it does:\n  1. Checks the login state (credentials or sources.authToken); errors when not logged in\n  2. Reads component.yaml in the component directory and validates the Manifest format\n  3. Checks that the image reference is valid and that every file declared under artifacts exists\n  4. Creates a draft version → uploads the artifacts → turns it stable\n  5. Sets the visibility (--visibility)\n\nPublishing in three steps is deliberate: when a version turns stable the Market checks that \"the files match the artifacts declaration\",\nand creating a draft first guarantees there is never a half-finished \"already stable but files not all uploaded\" version.\n\n--path also accepts the archive directory, for example ./components/.archived/erp/backend."
