cli.release.short: "Release a component version: check, tag and push to its Git repository"
cli.release.long: "Release a component without a market: a release is a Git tag, pushed to the component's own repository.\n\nThe version is metadata.version in component.yaml — the single source of truth. Only component.yaml is read;\na brickkit.yaml in the same directory (the author's local workbench) plays no part.\n\nBefore anything is written, every check must pass:\n  - component.yaml parses and validates\n  - the component directory has no uncommitted changes (for a component in a subdirectory of a monorepo,\n    only its own directory counts)\n  - the branch has an upstream and nothing unpushed: the tagged commit must already be in the remote history\n  - the tag does not exist yet, locally or on the remote\nThen the tag is created and pushed. If the push fails, the local tag is deleted again — a release either\nhappens completely or leaves no trace.\n\nThe tag is <version> when the component directory is the repository root, and <scope>-<name>/<version>\nwhen it is a subdirectory — the names the git install source reads.\n\n--local releases every component in the project's local install sources: all of them are checked first,\nthen tagged and pushed one by one. One already released (its tag is on the current commit) is skipped;\nat the first push failure it stops — earlier releases stay, later ones are not attempted.\n\nbrickkit publish (to a market) is a separate command."
cli.release.example: "  brickkit release                                  the component in the current directory\n  brickkit release --path ./components/erp/backend\n  brickkit release --path svc/api                   a component in a monorepo subdirectory (tag erp-api/<version>)\n  brickkit release --local                          every local-source component of the project"
