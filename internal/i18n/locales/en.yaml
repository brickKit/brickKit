# cobra's own texts: the usage template, the built-in help and completion commands, and the -h flag.
# An empty value keeps cobra's built-in English. cobra.help_flag: %[1]s is the command's display name,
# %[2]s its command path.
cobra.usage_template: ""
cobra.help_short: ""
cobra.completion_short: ""
cobra.completion_long: "Print the script that lets your shell complete brickkit's commands, flags, component IDs, versions and deploy files when you press TAB.\n\ninstall.sh has already installed it for the shells it found (bash, zsh, fish). To set it up by hand, see the help of your shell's subcommand, e.g. brickkit completion bash --help.\nThe whole guide: docs/en/00-intro/03-shell-completion.md"
cobra.completion_bash_short: "Print the completion script for bash"
cobra.completion_bash_long: "Print the completion script for bash. It is loaded by the bash-completion package (apt install bash-completion, dnf install bash-completion, brew install bash-completion@2).\n\nFor this shell only:\n  source <(brickkit completion bash)\n\nFor every new shell (what install.sh does):\n  mkdir -p ~/.local/share/bash-completion/completions\n  brickkit completion bash > ~/.local/share/bash-completion/completions/brickkit\n\nThen open a new terminal."
cobra.completion_zsh_short: "Print the completion script for zsh"
cobra.completion_zsh_long: "Print the completion script for zsh.\n\nFor this shell only:\n  source <(brickkit completion zsh)\n\nFor every new shell, the file goes into a directory on zsh's $fpath. install.sh uses the first writable site-functions directory there; otherwise ~/.zsh/completions, which needs these two lines in ~/.zshrc:\n  fpath=(~/.zsh/completions $fpath)\n  autoload -Uz compinit && compinit\n\nBy hand:\n  mkdir -p ~/.zsh/completions\n  brickkit completion zsh > ~/.zsh/completions/_brickkit\n\nThen open a new terminal."
cobra.completion_fish_short: "Print the completion script for fish"
cobra.completion_fish_long: "Print the completion script for fish.\n\nFor this shell only:\n  brickkit completion fish | source\n\nFor every new shell (what install.sh does):\n  brickkit completion fish > ~/.config/fish/completions/brickkit.fish\n\nThen open a new terminal."
cobra.completion_powershell_short: "Print the completion script for PowerShell"
cobra.completion_powershell_long: "Print the completion script for PowerShell.\n\nFor this session only:\n  brickkit completion powershell | Out-String | Invoke-Expression\n\nFor every new session, add that line to your profile (the file $PROFILE names)."
cobra.completion_no_descriptions: "leave out the one-line description next to each candidate"
cobra.help_flag: ""

