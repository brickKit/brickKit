cli.add.short: "Add a component, pull its dependencies and artifacts recursively, and write it into the three layers"
cli.add.long: "Pull a component and its dependencies, and write all three files at once: the declaration in brickkit.yaml, the entries in deploy.yaml (and deploy.local.yaml when it exists), and the config skeleton in config/.\n\nWithout a version, the latest exact version in the install source is pinned into brickkit.yaml. When a dependency needs another version of a component already in the project, that version is kept with requiredBy (multiple versions side by side). Adding a shell brings in the members it compiles in, at the declared versions, nested under the shell.\n\nIf the project would not load afterwards, every file is restored."
cli.add.example: "  brickkit add erp/backend                    # latest tag, pinned as an exact version\n  brickkit add erp/backend@1.0.0              # a given version\n  brickkit add --local                        # every component in the local sources at once\n  brickkit add --local --init                 # ...and give each one its own local workbench first\n  brickkit add erp/backend@1.0.0 --repo       # also clone the source (at this version)\n  brickkit add erp/backend@1.0.0 --yes        # non-interactive (CI/CD)"
