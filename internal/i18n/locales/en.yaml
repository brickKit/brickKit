cli.hooks.header_comment: "Written by brickkit init --hooks. Safe to overwrite when upgrading; delete this file to uninstall.\n\nIt guards against one thing: component source committed under components/.archived/ while deploy.yaml says it should start.\nSee brickkit restore --check for the criterion and the way out.\n\n--log-level off is required, not fussiness: on an error the default also writes a JSON log line to stderr,\nand the reader here is someone in the middle of a commit who was suddenly stopped — what they want to see is the human sentence,\nnot that sentence followed by a {\"time\":...,\"level\":\"ERROR\"} line. The error itself doesn't go through the log,\nso turning the log off doesn't make it disappear."
