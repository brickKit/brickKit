cli.upgrade.use: "upgrade [component-id[@version]]"
cli.upgrade.short: "Upgrade a component's default version and migrate its config"
cli.upgrade.long: "Move a component's default version, and the three files follow: brickkit.yaml's version and requiredBy, the deploy entries, and config/ migrated (old values copied, new keys at their defaults, dropped keys kept in the archive). When something still depends on the old version, it stays as a compatibility version. Upgrading a shell switches to the member versions the new shell compiles in.\n\nA key the user changed whose default also changed is a conflict: chosen one by one in a terminal; with --yes or without input it is written as a duplicate key, and up refuses to start until it is resolved. With no component, every component with a newer version is upgraded, all or nothing."
cli.upgrade.example: "  brickkit upgrade                    # every component with a newer version\n  brickkit upgrade erp/backend        # to the latest\n  brickkit upgrade erp/backend@2.0.0  # to a given version\n  brickkit upgrade --dry-run          # only show what would happen"
