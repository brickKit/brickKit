cli.sync.reason_restored: "re-enabled"
cli.lint.short: "Check the three layers (brickkit.yaml, deploy files, config/) and component.yaml offline"
cli.lint.long: "Without network access and without needing Docker / K8s, check the YAML in this directory, read-only.\n\nTwo scenarios, decided automatically from the current directory (same rule as brickkit skills; when both are present the project wins):\n\n  Project (has brickkit.yaml)\n      Check brickkit.yaml, then the deploy files (deploy.yaml, and deploy.local.yaml when present; with -f only that file),\n      then the three layers together exactly as up loads them: every component version has one deploy entry, shell members\n      sit under a shell, $var: references are defined, config/ files match components, no duplicate keys left by an upgrade.\n      Both deploy.yaml and deploy.local.yaml (when present) must match brickkit.yaml, whether local mode is on or off.\n      Then each component's configuration against its configSchema — required items have values, written keys exist in the\n      schema, and a shell member's values can be JSON-encoded into its shell —\n      plus the shell declarations: kind: shell agrees with the shell block, and each member placed under a shell is compiled into it —\n      for every component whose manifest is on disk\n      (the .brickkit/manifests/ cache, or its local source directory); the others are listed as not checked.\n      Finally every component.yaml under the local install source (type: local) directories — whether or not it has been added.\n      The archive directory (.archived/) is not checked.\n      When brickkit.yaml itself doesn't pass, nothing after it can be trusted, so the next steps are skipped and says so.\n  Component repository (has component.yaml, no brickkit.yaml)\n      Check only that one component.yaml.\n\nIt checks the existing structural rules: required fields, types, unknown fields (spelling slips), version format, port ranges;\nthere are two kinds of warning — a misspelled key inside configSchema (such as defualt) won't take effect, and a config item name that collides\nwith a platform-reserved variable. The latter is checked more fully than up does: up only meets it when a config item has a default or is overridden by config,\nwhile lint checks every item declared in configSchema (the same scope as at Market publish time).\n\n--strict also checks references: a ${VAR} that is set neither in the process environment nor in .env, and a file:// whose file\ndoes not exist, are warnings — and with --strict warnings fail.\n\nIt does not check: whether dependencies can be resolved, or whether the member versions a shell hosts this time match the versions compiled into it — those need the resolved dependency graph, which lint deliberately never builds (that can mean a network call for a market or version-controlled component), and are left to up / graph;\nthe values behind enum, minimum and the like in configSchema (the platform doesn't validate values, see docs/en/11-reference/04-config-schema-spec.md).\n\nExit code 1 on errors; 0 with only warnings, and with --strict warnings count as failures too, for a CI gate."
cli.lint.example: "  brickkit lint\n  brickkit lint --strict           warnings count as failures too (CI gate)\n  brickkit lint -f deploy.prod.yaml"
cli.lint.warnings_count_as_failures_too: "Warnings count as failures too (exit code 1), for a CI gate"
