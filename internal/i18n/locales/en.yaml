cli.logout.log_out_of_the_market: "Log out of the Market: revoke the token on the server and delete the local credentials"
cli.logout.log_out_of_the_component: "Log out of the component Market.\n\nIt does two things:\n  1. Calls the Market's POST /auth/logout to revoke this token (the server side)\n  2. Deletes .brickkit/credentials (the local side)\n\nThe local copy is always deleted, even when the Market is unreachable — otherwise a network blip would leave someone believing they have logged out\nwhile the credentials still sit on disk. When the Market is unreachable it only warns, and says the token stays valid\nuntil it expires.\n\nWhen you aren't logged in it does nothing, and that isn't a failure."
