cli.fetch.short: "Download a component's artifacts (API contract, SDK, ...) without installing it into the project"
cli.fetch.long: "Download the artifact files a component declares, but don't install it into this project.\n\nFor cross-project calls: you want the other side's .proto / openapi.json to generate a client,\nbut that service is deployed by another project, and writing it into brickkit.yaml would make the platform deploy another copy on your side.\n\nWithout a version it takes the latest version in the install source.\n\nArtifacts land in .brickkit/artifacts/<versioned-service-name>/<type>/... —\nexactly the same place as what brickkit add downloads. .brickkit/ is a local cache and is not committed to Git:\nteammates run the same fetch on their own machines; to commit the contract with the project, copy the files you need into a directory of your own.\n\nThis command is read-only: it doesn't modify brickkit.yaml, generate deployment files, or start anything."
cli.fetch.example: "  brickkit fetch infra/notifier@1.0.0   fetch the artifacts of a specific version\n  brickkit fetch infra/notifier         fetch the artifacts of the latest version"
