# BrickKit CLI messages — English. This is the source catalog: every key is declared here first,
# and every other locales/<lang>.yaml has exactly the same keys.
# Each text is written in double quotes ("…") or as a literal block (|); %[1]s, %[2]d… are the
# message's arguments, by position. A comment above a key says when to use it.
# After adding or removing a key here, run: make generate-msgid

# The skeleton clierr renders every error with: a detail line ("Label: value") and the suggestion label.
detail.line: "%[1]s: %[2]s"
hint.label.single: "Suggestion: %[1]s"
hint.label.multi: "Suggestions:"

version.manifest_line: "Supported Manifest version: %[1]s"
version.targets_line: "Supported deploy targets: %[1]s"
version.commit_line: "Git commit: %[1]s"
version.build_date_line: "Build date: %[1]s"

# Detail labels shared by every package (WithDetail's first argument). A label belongs here when two or
# more unrelated packages use it with exactly the same meaning; label.source is the "sources" setting,
# not any source in general.
label.path: "Path"
label.reason: "Reason"
label.component: "Component"
label.source: "Install source"
label.file: "File"
label.dir: "Directory"
label.image: "Image"
label.config_key: "Config item"
label.impact: "Impact"
label.address: "Address"
label.output: "Output"
label.command: "Command"
label.repo: "Repository"

# Punctuation that changes with the language: the separator between listed names (component IDs, config
# items…).
list.separator: ", "

# A number together with its noun ("3 files" / "1 file"), used through i18n.Count; a sentence takes the
# phrase through %s, so singular and plural are solved once here, not in every sentence. The .one key is
# the singular form; a language without one (zh) leaves it out.
count.components: "%[1]d components"
count.components.one: "%[1]d component"
count.files: "%[1]d files"
count.files.one: "%[1]d file"
count.items: "%[1]d items"
count.items.one: "%[1]d item"
count.warnings: "%[1]d warnings"
count.warnings.one: "%[1]d warning"
count.manifests: "%[1]d manifests"
count.manifests.one: "%[1]d manifest"

project.missing: "Error: project config file not found"
