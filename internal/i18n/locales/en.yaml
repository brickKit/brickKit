cli.deps.short: "Print the dependency tree"
cli.deps.long: "Print the project's dependencies as a tree.\n\nbrickkit.yaml only locks versions; what depends on what is each component's own business, written in its\ncomponent.yaml. This command reads it from there — the same resolved graph brickkit graph draws\n(uncached manifests are fetched from their install source).\n\n  brickkit deps               one tree per top-level component (nothing in the project depends on it)\n  brickkit deps <id>          that component's tree — every version of it in the project — and what requires it\n  brickkit deps <id>@<ver>    one version only\n\nA component version is expanded once per output; later occurrences say (shown above).\nWeak dependencies say (optional); one that is not in the project says (optional, not installed)."
cli.deps.example: "  brickkit deps\n  brickkit deps erp/backend\n  brickkit deps erp/backend@2.0.0"
