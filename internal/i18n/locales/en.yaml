cli.root.example: "  brickkit init my-project              initialize a project\n  brickkit add erp/backend@1.0.0        add a component (dependencies are pulled recursively)\n  brickkit up --dry-run                 compute without starting: see what would run and in what order\n  brickkit up                           generate deployment files and start\n  brickkit status                       show the running state\n  brickkit down                         stop (volumes are kept)"
cli.root.long: "BrickKit CLI — build systems like snapping together bricks.\n\nYou declare which components you want and what they depend on; the CLI derives the rest and hands it to Docker, Podman or Kubernetes.\nA project is described in three layers:\n  brickkit.yaml       which components, at which exact versions\n  deploy.yaml         how they are deployed (your personal deploy.local.yaml stays out of Git)\n  config/             the environment variables each component gets\n\nWhat the CLI does:\n  1. Pull components and artifacts (Git / local directories / Market) and write them into the three layers\n  2. Resolve dependencies and work out the start order (required/optional dependencies + topological sort)\n  3. Generate deployment files, run migrations and call the underlying engine (compose / kubectl)\n  4. Build local images and release component versions (build / release / publish)\n  5. Manage the component source workspace (--repo / sync)\n\nIt is not a long-running service: it exits once the command finishes and uses no background resources."
cli.add.add_component_id_exact_version: "add [component-id[@exact-version]]"
cli.build.use: "build [component-id[@version]]"
cli.build.short: "Build the component images that need a local build"
cli.build.long: "Build the images that need a local build: components without deployment.image, and components in a local install source (code under development, so the image must come from it). git and market components with an image are pulled, not built.\n\nThe image tag equals the component's metadata.version, and a shell image records the member versions compiled into it, which up checks. An existing image is skipped unless --force. The source is the local repository when it holds that version, otherwise the version's git tag is exported.\n\nup never builds: when an image is missing it fails and points here."
cli.build.example: "  brickkit build                      # build every component that needs a local build\n  brickkit build erp/backend          # only this component\n  brickkit build erp/backend --force  # rebuild after changing the code"
cli.build.flag_force: "Rebuild even when the image already exists"
