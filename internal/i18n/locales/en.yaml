cli.status.long: "Show the running state of every component in the current project.\n\nThe CLI stores no running state itself; it queries the engine the deploy file's target names:\n  docker   docker compose ps -a --format json\n  podman   podman compose ps -a --format json\n  k8s      kubectl get deployments -o json (in the project's namespace)\n\nThe output covers: running components, components that aren't started and why (marked when the reason comes from deploy.local.yaml),\nand locally debugged components (mode: debug). mode: local components are processes supervised by an up in another terminal\nand aren't in the table; when such a session is running, it names the process."
