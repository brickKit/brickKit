cli.local.short: "Manage deploy.local.yaml, your personal copy of deploy.yaml"
cli.local.long: "Manage local mode: your personal deploy file deploy.local.yaml (never committed).\n\nWhile local mode is on, every command reads deploy.local.yaml instead of deploy.yaml — the whole file,\nnot a merge of the two, so what you see in it is exactly what runs. That is where personal facts go:\nmode: debug for the component you are debugging, a localPort that is free on your machine, a vars value\nfor your own database, even a different target.\n\n  brickkit local on        turn local mode on; the first time, deploy.yaml is copied (only its team-file header is swapped for a personal-file one)\n  brickkit local off       turn it off (the file stays, and is used again by the next local on)\n  brickkit local status    the switch, the file, and whether the file still matches brickkit.yaml\n  brickkit local refresh   copy deploy.yaml afresh after the team changed it; the old file is kept as\n                           deploy.local.yaml.bak and every local change in it is listed, for you to merge back\n\nThe file must list exactly the components brickkit.yaml declares: when the team adds one, up refuses\nto run until you refresh (or edit the file, or turn local mode off).\nOne run can ignore the file with --no-local; -f <file> ignores it too."
cli.local.example: "  brickkit local on\n  brickkit local status\n  brickkit local refresh      after the team changed deploy.yaml\n  brickkit local off"
