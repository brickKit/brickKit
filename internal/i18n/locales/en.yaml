cli.restore.short: "Restore mode in deploy.yaml and the component source layout to the last commit"
cli.restore.long: "Restore the mode value of each component in deploy.yaml to what the last commit has, then let the source layout follow.\n\nWho it is for: projects that removed components/ from .gitignore so component source travels with the project in version control.\nIn such projects, the directory moves made by brickkit sync land in the project's diff, and \"turn off a few top-level components,\narchive with sync, forget to restore, and commit\" keeps happening.\n\nIt touches only the mode field of deploy.yaml (the team file), entry by entry:\n\n  - entries present in both the working tree and the last commit → mode goes back to the committed value (the field is removed if the commit doesn't set it)\n  - entries new in the working tree (just added, or a bare id turned into id@version) → not touched at all\n  - entries in the commit but not in the working tree → never added back (this is not git revert)\n\ndeploy.local.yaml is your personal file and never committed, so there is nothing to restore it to; it is left alone.\nEvery other change is left alone too, so a component you just added is not eaten by it. Old values that get overwritten are printed before it acts.\n\n--check only checks and changes nothing: are the deploy.yaml about to be committed and the directory layout about to be committed consistent with each other?\nIf not, it exits non-zero — the pre-commit hook calls exactly this (installed by brickkit init --hooks)."
cli.restore.example: "  brickkit restore           restore mode and the source layout\n  brickkit restore --check   only check whether this commit is self-consistent (a non-zero exit code means it is not)"
cli.restore.only_check_whether_the_yaml: "Only check whether the yaml and directory layout about to be committed are self-consistent, and change nothing (for the pre-commit hook)"
