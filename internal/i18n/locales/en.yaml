cli.new.short: "Generate the minimal skeleton of a new component"
cli.new.long: "Generate a component skeleton: a component.yaml that passes brickkit up --dry-run validation,\nand a BRICKKIT.md with the standard sections (purpose, dependencies, configuration, contracts, shell declaration)\nfor the people and AI assistants who will use the component.\n\nBy default it writes to components/<scope>/<name>/ — the local install source scans exactly this layout\n(<scope>/<name>/component.yaml), and brickkit add --repo clones source here too,\nso brickkit add --local can add it to the project with no extra configuration.\n\n--shell generates a shell (a component other components are compiled into): its component.yaml gets\nshell.members with one placeholder member to replace, and it goes to shell/<scope>/<name>/ by default\n(the local install source local-shells) — shells are project code, committed with the project.\n\n--path writes to another directory, for a component that lives in its own Git repository (one component, one repository):\nthe directory itself is then the component repository root, without the <scope>/<name> layer.\n\nIt does not run brickkit add for you afterwards: writing into brickkit.yaml is a separate, reviewable\naction. It doesn't install the AI assistant skills either — the project root already has them; in the standalone repository\ncase, run brickkit skills update yourself."
cli.new.example: "  brickkit new demo/widget                          write to components/demo/widget/\n  brickkit new demo/widget --contract openapi       also generate an OpenAPI contract placeholder file\n  brickkit new demo/widget --contract proto         also generate a proto contract placeholder file\n  brickkit new erp/shell --shell                    a shell skeleton, written to shell/erp/shell/\n  brickkit new demo/widget --path ../widget-repo    write to another directory (standalone repository case)"
