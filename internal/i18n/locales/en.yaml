cli.down.stop_the_project_the_stop: "Stop the project.\n\nThe stop order is the reverse of the start order (dependents first, dependencies last), and is left to the engine.\n\nTo stop only a few components: write mode: disable on their entries in the deploy file, then run brickkit up.\nThe generated deployment files no longer contain them, so the engine removes the matching containers as well —\nthe effect is the same as \"stop just these\", and the configuration keeps a trace of it, so the next up won't bring them back.\n\nImportant: down does not delete volumes; database data is always kept.\nFor a full cleanup, run docker/podman volume rm or docker/podman compose down -v by hand."
