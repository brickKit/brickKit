cli.graph.short: "Output the project's dependency topology as a Mermaid diagram"
cli.graph.long: "Draw the current project's dependency topology as a Mermaid diagram and print it to stdout.\n\nWhat is in the diagram:\n  nodes     component id@version; mode: local ones are marked \"managed locally\" (with the port too if localPort is set)\n  solid     required dependency; dashed is an optional dependency (an optional one that can't be found is drawn as a \"not installed\" node)\n  greyed    components that won't start this run (turned off by mode: disable, or not running because everything above them is off)\n  shell     members hosted by a shell this run (members in the deploy file) are drawn inside their shell (subgraph)\n\ngraph never reads local mode — it reads deploy.yaml (or the file given with -f), so mode: debug, which lives only in deploy.local.yaml, never appears here.\n\nEdges are always drawn, whether or not the other end starts this run — the diagram shows the declared structure, and \"started or not\" is expressed by node style.\n\nNothing but Mermaid goes to stdout, so it can be saved straight to a .mmd file (brickkit graph > graph.mmd),\nand GitHub renders .mmd / .mermaid files directly; inside Markdown you must wrap it in a mermaid code fence\n(fence language mermaid) — pasting the text alone won't be rendered. Warnings from dependency resolution go to stderr.\nLike up, Market / Git components that aren't cached yet are fetched over the network for their Manifest; if the dependency graph can't be resolved it reports the same errors."
cli.graph.example: "  brickkit graph\n  brickkit graph > graph.mmd\n  brickkit graph --ignore-shells   ignore every shell's members and show each component as if it started on its own"
cli.graph.ignore_shells_flag: "Ignore every shell's members before drawing (same meaning as up --ignore-shells); nothing is written back"
cli.graph.shells_ignored_note: "    %% Every shell's members are ignored (--ignore-shells: only for verifying that components can start on their own)"
