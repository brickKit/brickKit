cli.sync.short: "Tidy the component source workspace: move source you don't need this run into .archived/"
cli.sync.long: "Move component source you don't need right now from components/ into components/.archived/.\n\nOnce a project has many components, the source you aren't touching at the moment still piles up under components/:\nIDE indexing, global search, grep, and any AI reading code for you all have to scan it too.\nsync moves it into one fixed directory — you don't have to care about it until you open it, and when you need it you know exactly where it is.\n\nThe criterion is exactly the same as brickkit up: what will start this run stays in the active directory, what won't start is archived.\nTo narrow the scope, change mode in the deploy file (turn off the top level and everything below it follows),\nand sync follows along.\n\nRules:\n\n  - Two-way: what should be archived is archived, what should be active is moved back\n  - It doesn't affect running containers and doesn't change who up will start — it only touches directories\n  - It only operates on components that are declared in brickkit.yaml and already have source\n  - The whole directory moves, .git included, so git commands keep working after archiving\n  - There is no --dry-run: if you get it wrong, run it once more and everything comes back"
cli.sync.example: "  brickkit sync   move the source of components that won't start this run into .archived/, and move back the ones that should return"
