cli.init.example: "  brickkit init my-shop                 create my-shop/ with the full skeleton\n  brickkit init                         complete the current directory (asks first if it is not empty)\n  brickkit init --name my-shop --yes    complete without asking (CI)\n  brickkit init my-shop --no-skills     don't install the AI assistant skills\n  brickkit init --hooks                 only add the pre-commit hook"
cli.init.long: "Create a BrickKit project, or complete one.\n\nTwo modes on the same primitive — check what a complete project has, create what is missing, leave what exists:\n  brickkit init <name>   creation: makes the directory <name>/ and the full skeleton in it\n  brickkit init          completion: fills in what the current directory lacks (an existing project,\n                         or a component repository that becomes its own local workbench)\n\nA complete project has brickkit.yaml (which components, which versions), deploy.yaml (how they are deployed),\nconfig/vars.yaml (shared values), the components/ and shell/ local sources, BRICKKIT.md (the project map) and a .gitignore.\ndeploy.local.yaml is never created here: brickkit local on makes it when you want it.\n\nIn completion mode:\n  - existing files are skipped, never touched\n  - an existing .gitignore is checked, never edited: each missing required entry is a loud warning\n    (without them personal deploy files and secrets get committed)\n  - in a non-empty directory the plan is shown first and needs a yes (--yes skips the question)\n  - the project name is --name, else the existing brickkit.yaml's project, else the directory name\n  - finally the project is loaded the way lint and up load it; if that fails, the command fails\n\nThe project name: only lowercase letters, digits and hyphens, starting and ending with a letter or digit\n(it names the K8s namespace and the Docker network).\n\nThe AI assistant skills (.claude/skills/, AGENTS.md) are installed too; add --no-skills if you don't want them.\nIt never touches your CLAUDE.md.\n\nWhen the project root is a Git repository root, a pre-commit hook is installed as well;\nfor a project nested inside someone else's repository, install it explicitly with brickkit init --hooks."
