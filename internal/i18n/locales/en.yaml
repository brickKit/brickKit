cli.skills.short: "Show and refresh the AI assistant skills installed into the project"
cli.skills.long: "Manage the AI assistant skills installed into this project (.claude/skills/, AGENTS.md).\n\nThese files are installed by brickkit init, committed with the project and shared by the team. They describe the behavior of\nthis CLI version, so they need refreshing once after a CLI upgrade.\n\n  brickkit skills          show the state of each file (read-only, same as status)\n  brickkit skills status   same as above\n  brickkit skills update   install what is missing, refresh what is outdated\n\nHand-edited files are never overwritten. update lists them and skips them. To discard local\nedits, delete that file and run update again — --force is deliberately not offered: deleting a file\nis already explicit enough, and one more switch is one more way to hurt yourself.\n\nIt also works in a standalone component repository (has component.yaml, no brickkit.yaml): there it manages only\nthe brickkit-component skill — the project-overview and assemble/deploy/troubleshoot skills make no sense there.\nThe component repository's own AGENTS.md is not touched at all.\n\nYour CLAUDE.md is not touched either: that is your own workflow file."
cli.skills.example: "  brickkit skills          see what is installed and whether it is out of date\n  brickkit skills update   refresh to the current CLI version"
cli.skills.status_short: "Show the state of each skill file (read-only)"
cli.skills.update_short: "Install what is missing and refresh what is outdated; skip hand-edited ones"
cli.skills.update_example: "  brickkit skills update\n  brickkit skills update --lang %[1]s   reinstall the skills in another language"
