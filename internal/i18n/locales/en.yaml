cli.login.long: "Log in to the BrickKit Market.\n\nWhat it does:\n  1. Asks for the user name in the terminal\n  2. Asks for the password in the terminal (input hidden)\n  3. Calls the Market API to verify the credentials\n  4. On success writes the token to .brickkit/credentials (permissions 0600)\n\nThe Market address is taken from the install source of type market in brickkit.yaml; if several are configured, choose with --market.\n\nToken priority: .brickkit/credentials > sources.authToken in brickkit.yaml.\nBefore each use of a token the CLI checks expiresAt; when expired it asks you to log in again (there is no automatic refresh)."
