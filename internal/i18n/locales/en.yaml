cli.up.example: "  brickkit up\n  brickkit up --dry-run              only generate the files, don't start\n  brickkit up -f deploy.prod.yaml    use another deploy file (one complete file per environment)\n  brickkit up --no-local             ignore deploy.local.yaml for this run\n  brickkit up --focus erp/api        run one component (from source) and what it needs"
cli.up.long: "Start the project in one go.\n\nHow it flows:\n  1. Load the three layers: brickkit.yaml, the deploy file (deploy.yaml; deploy.local.yaml in local mode; or the one -f names), config/, and the Manifests of all components\n  2. Decide who starts and who stops (follows the top: a top-level component without mode runs, lower ones follow the ones above)\n  3. Check required dependencies (missing → error) and optional dependencies (missing → warning, and no environment variable is injected at all)\n  4. Topological sort gives the start order\n  5. Resolve configuration, inject environment variables, merge resource quotas, and generate the deployment files:\n     compose.yaml for docker / podman, Kubernetes manifests for k8s\n  6. When there are mode: debug components, generate local-debug.<versioned-service-name>.env for you to start them from your IDE\n  7. Check images: an image built on this machine must already exist (up never builds; a missing one points you at brickkit build); a pulled image must be reachable\n  8. Call the underlying engine to start; database migrations run first (a one-shot container on Docker, a Job on K8s), and a failure blocks the main service\n  9. When there are mode: local components, up starts and supervises those host processes in the foreground; Ctrl+C stops them\n\nWhen a component's version differs from the last up, it says so, and --dry-run also prints a change summary; moving a version itself is brickkit upgrade's job."
