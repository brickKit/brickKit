cli.release.short: "发布组件版本：校验、打 tag 并推送到组件的 Git 仓库"
cli.release.long: "不经市场发布组件：发布就是往组件自己的仓库推一个 Git tag。\n\n版本号取 component.yaml 的 metadata.version——唯一的事实来源。只读 component.yaml；\n同一目录里的 brickkit.yaml（作者的本地联调工作台）与发布无关。\n\n写任何东西之前，这些检查必须全部通过：\n  - component.yaml 能解析、能通过校验\n  - 组件目录里没有未提交的改动（monorepo 子目录里的组件只看它自己的目录）\n  - 当前分支有上游、没有未推送的提交：打 tag 的提交必须已经在远端历史里\n  - 这个 tag 还不存在（本地和远端都查）\n然后打 tag 并推送。推送失败时删掉本地 tag——发布要么完整做完，要么不留痕迹。\n\n组件目录是仓库根时 tag 是 <版本>，是子目录时是 <scope>-<name>/<版本>——\n正是 git 安装源读取的名字。\n\n--local 发布项目本地安装源里的每一个组件：先全部检查一遍，再逐个打 tag、推送。\n已经发布过的（tag 就在当前提交上）跳过；遇到第一个推送失败就停——之前发布的保留，之后的不再尝试。\n\n发布到市场是另一条命令：brickkit publish。"
cli.release.example: "  brickkit release                                  当前目录的组件\n  brickkit release --path ./components/erp/backend\n  brickkit release --path svc/api                   monorepo 子目录里的组件（tag 为 erp-api/<版本>）\n  brickkit release --local                          项目里的全部本地源组件"
