cli.logout.log_out_of_the_component: "退出组件市场的登录。\n\n做两件事：\n  1. 调市场的 POST /auth/logout 作废这个 Token（服务端那一侧）\n  2. 删掉 .brickkit/credentials（本地那一侧）\n\n本地那一份一定会删，即使市场连不上——否则一次网络抖动就让人以为自己已经\n退出了，而凭据还躺在盘上。市场不可达时只警告一句，并说明那个 Token 仍然有效\n到过期为止。\n\n没登录时什么都不做，也不算失败。"
