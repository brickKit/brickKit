cli.deps.short: "打印依赖树"
cli.deps.long: "把项目的依赖关系打印成树。\n\nbrickkit.yaml 只锁版本；谁依赖谁是各组件自己的事，写在它的 component.yaml 里。\n这条命令从那里读出来——与 brickkit graph 画的是同一张解析好的依赖图\n（没缓存的 Manifest 会从安装源获取）。\n\n  brickkit deps               每个顶层组件（项目里没有谁依赖它）一棵树\n  brickkit deps <id>          这个组件的树（项目里它的每个版本各一棵），以及谁依赖它\n  brickkit deps <id>@<版本>   只看这一个版本\n\n一个组件版本在一次输出里只展开一次，之后再出现标（见上）。\n弱依赖标（弱依赖）；不在项目里的弱依赖标（弱依赖，未安装）。"
cli.deps.example: "  brickkit deps\n  brickkit deps erp/backend\n  brickkit deps erp/backend@2.0.0"
