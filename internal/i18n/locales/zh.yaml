cli.add.short: "添加组件，递归拉取依赖与产物，写进三层文件"
cli.add.long: "拉取组件及其依赖，一次写好三份文件：brickkit.yaml 的声明、deploy.yaml（以及存在的 deploy.local.yaml）的部署条目、config/ 的配置骨架。\n\n不写版本时取安装源里最新的精确版本并钉进 brickkit.yaml。依赖要的是项目里已有组件的另一个版本时，这个版本以 requiredBy 保留（多版本共存）。add 一个外壳时，它编进的成员按声明的版本一起加进来、嵌在外壳下面。\n\n改完之后项目装载不了，全部还原。"
cli.add.example: "  brickkit add erp/backend                    # 最新 tag，钉成精确版本\n  brickkit add erp/backend@1.0.0              # 指定版本\n  brickkit add --local                        # 本地安装源里的组件一次全加\n  brickkit add --local --init                 # ……并先给每个组件建好本地联调工作台\n  brickkit add erp/backend@1.0.0 --repo       # 顺便克隆源码（检出这个版本）\n  brickkit add erp/backend@1.0.0 --yes        # 非交互（CI/CD）"
