cli.restore.short: "把 deploy.yaml 的 mode 与组件源码结构还原到最后一次提交"
cli.restore.long: "把 deploy.yaml 里各组件的 mode 还原成最后一次提交的值，再让源码结构跟着走。\n\n给谁用：把 components/ 从 .gitignore 去掉、让组件源码跟项目一起进版本库的项目。\n那种项目里 brickkit sync 移动目录会进项目的 diff，而\"关掉几个顶层、\nsync 归档、忘了还原就提交\"总会发生。\n\n它只动 deploy.yaml（团队文件）的 mode 字段，逐条目：\n\n  - 工作区与最后一次提交都有的条目 → mode 回到提交里的值（提交里没写就删掉这个字段）\n  - 工作区新增的条目（刚 add 的，或裸 id 改成了 id@version）→ 一个字不动\n  - 提交里有、工作区没有的条目 → 绝不加回来（这不是 git revert）\n\ndeploy.local.yaml 是个人文件、不进版本库，没有可还原的基准，保持原样。\n其余改动也都不动，所以刚 add 的组件不会被它吃掉。被覆盖的旧值会在动手前打印出来。\n\n--check 只检查、不改任何东西：即将提交的 deploy.yaml 与即将提交的目录结构是否自洽？\n不自洽就以非零退出——pre-commit 钩子调用的正是它（由 brickkit init --hooks 安装）。"
cli.restore.example: "  brickkit restore           还原 mode 与源码结构\n  brickkit restore --check   只检查这次提交自洽不自洽（退出码非零表示不自洽）"
