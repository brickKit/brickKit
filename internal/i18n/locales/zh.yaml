cli.hooks.header_comment: "由 brickkit init --hooks 写入。可安全覆盖升级；想卸载就删掉这个文件。\n\n它拦一件事：组件源码提交在 components/.archived/ 里，而 deploy.yaml 说它该启动。\n判据与出路见 brickkit restore --check。\n\n--log-level off 是必需的，不是洁癖：出错时默认会往 stderr 再写一行 JSON 日志，\n而这里的读者是一个正在提交、突然被拦下的人——他要看的是那句人话，\n不是紧跟着的一行 {\"time\":...,\"level\":\"ERROR\"}。错误本身不走日志，\n关掉日志不会让它消失。"
