cli.local.short: "管理 deploy.local.yaml（你个人的 deploy.yaml 副本）"
cli.local.long: "管理本地模式：你个人的部署文件 deploy.local.yaml（从不提交）。\n\n本地模式开着时，所有命令读 deploy.local.yaml 而不是 deploy.yaml——读整份文件，\n不是两份合并，所以文件里写的就是实际运行的。个人的事实写在这里：\n正在调试的组件写 mode: debug、本机空着的 localPort、自己数据库的 vars 值，甚至换一个 target。\n\n  brickkit local on        开启本地模式；第一次开启时从 deploy.yaml 复制（只把团队文件的文件头换成个人文件的说明）\n  brickkit local off       关闭（文件留着，下次 local on 接着用）\n  brickkit local status    开关、文件、以及文件是否还与 brickkit.yaml 一致\n  brickkit local refresh   团队改了 deploy.yaml 之后重新复制；旧文件保存为 deploy.local.yaml.bak，\n                           其中每一处本地修改都列出来，由你合并回去\n\n文件里的组件必须与 brickkit.yaml 声明的完全一致：团队新加了组件，up 会拒绝运行，\n直到你 refresh（或者手改文件、或者关掉本地模式）。\n单次运行可以用 --no-local 忽略它；-f <文件> 也会忽略它。"
cli.local.example: "  brickkit local on\n  brickkit local status\n  brickkit local refresh      团队改了 deploy.yaml 之后\n  brickkit local off"
