cli.up.example: "  brickkit up\n  brickkit up --dry-run              只生成文件，不启动\n  brickkit up -f deploy.prod.yaml    使用另一份部署文件（每个环境一份完整文件）\n  brickkit up --no-local             本次忽略 deploy.local.yaml\n  brickkit up --focus erp/api        只运行这个组件（从源码跑）和它需要的"
cli.up.long: "一键启动项目。\n\n行为流程：\n  1. 装载三层文件：brickkit.yaml、部署文件（deploy.yaml；本地模式下 deploy.local.yaml；或 -f 指定的那份）、config/，以及所有组件的 Manifest\n  2. 启停判定（跟着上层走：顶层没写 mode 就跑，下层跟上层）\n  3. 检查强依赖（缺失报错）与弱依赖（缺失警告，且完全不注入环境变量）\n  4. 拓扑排序得出启动顺序\n  5. 解析配置、注入环境变量、合并资源配额，生成部署文件：\n     docker / podman 生成 compose.yaml，k8s 生成 Kubernetes 清单\n  6. 有 mode: debug 组件时生成 local-debug.<版本化服务名>.env，给你在 IDE 里启动它用\n  7. 检查镜像：本机构建的镜像必须已经在（up 从不构建，缺了就提示 brickkit build）；拉取的镜像要取得到\n  8. 调用底层引擎启动；数据库迁移先跑（Docker 一次性容器、K8s Job），失败则阻断主服务\n  9. 有 mode: local 组件时，由 up 在前台启动并看护这些本机进程，Ctrl+C 停止\n\n组件版本与上一次 up 不同时会提示一句，--dry-run 还会输出变更摘要；移动版本本身是 brickkit upgrade 的事。"
