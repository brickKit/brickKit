cli.remove.short: "移除组件：删掉它在三层文件里的条目，配置移进 config/.archive/"
cli.remove.long: "检查强依赖方后移除组件：配置不删，移进 config/.archive/；deploy.yaml（以及存在的 deploy.local.yaml）里的条目一起删；删外壳时成员挪回顶层独立运行；只因它而保留的兼容版本（requiredBy 只剩它）一并移除。\n\n删的是默认版本、这个组件只剩一个版本时，剩下的那个转正成默认版本。组件的最后一个版本走了才删它的源码目录，而且先确认删了还找得回来。"
cli.remove.example: "  brickkit remove erp/backend                 # 只有一个版本时\n  brickkit remove erp/backend@1.0.0           # 有好几个版本时写明\n  brickkit remove erp/backend@1.0.0 --force   # 源码目录里有没推送的改动也删"
