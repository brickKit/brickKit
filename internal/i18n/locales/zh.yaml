cli.down.stop_the_project_the_stop: "停止项目。\n\n停止顺序与启动顺序相反（依赖方先停，被依赖方后停），交给引擎处理。\n\n只想停其中几个：在部署文件里给它们的条目写 mode: disable 再 brickkit up。\n生成的部署文件里没有它们，引擎会把对应的容器一并移除——效果与\"只停这几个\"\n相同，而且配置里留下了痕迹，下次 up 不会又把它们拉起来。\n\n重要：down 不删除 volume，数据库数据始终保留。\n如需彻底清理，请手动执行 docker/podman volume rm 或 docker/podman compose down -v。"
