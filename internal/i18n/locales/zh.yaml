cli.lint.short: "离线检查三层文件（brickkit.yaml、部署文件、config/）与 component.yaml"
cli.lint.long: "不联网、不需要 Docker / K8s，只读地把这个目录里的 YAML 检查一遍。\n\n两种场景，按当前目录自动判断（与 brickkit skills 同一条规则，两者都有时按项目算）：\n\n  项目（有 brickkit.yaml）\n      检查 brickkit.yaml，再检查部署文件（deploy.yaml，存在时还有 deploy.local.yaml；给了 -f 只查那一份），\n      再按 up 同一条装载路径把三层文件放在一起查：每个组件版本恰好一个部署条目、成员写在外壳下面、\n      $var: 都有定义、config/ 的文件对得上组件、没有升级遗留的重复 key。\n      deploy.yaml 与 deploy.local.yaml（存在时）都必须与 brickkit.yaml 一致，不管本地模式开没开。\n      然后按 configSchema 检查每个组件的配置——必填项有值、写下的键在 schema 里、外壳成员的值能 JSON 编码进外壳——\n      以及外壳声明：kind: shell 与 shell 块一致、放在外壳下面的成员确实编进了外壳；\n      只查盘上有 Manifest 的组件（.brickkit/manifests/ 缓存，或它的本地源目录），其余的列为未检查。\n      最后检查本地安装源（type: local）目录下的每一份 component.yaml——不管有没有 add 过。\n      归档目录（.archived/）不检查。\n      brickkit.yaml 自己没通过时，后面的都不可信，会跳过后续步骤并说明。\n  组件仓库（有 component.yaml、没有 brickkit.yaml）\n      只检查这一份 component.yaml。\n\n查的是已有的结构规则：必填字段、类型、未知字段（拼写笔误）、版本号格式、端口范围；\n警告有两类——configSchema 里拼错的键（比如 defualt）不会生效，以及配置项名字撞上\n平台保留变量。后一类比 up 查得更全：up 只在配置项有默认值、或被 config 覆盖时才会\n碰到它，lint 把 configSchema 里声明的每一项都查一遍（与市场发布时同一个范围）。\n\n--strict 还检查引用：进程环境与 .env 里都没有的 ${VAR}、文件不存在的 file://，都是警告——\n而 --strict 下警告即失败。\n\n不查：依赖能不能解析、外壳这次承载的成员版本与它编进的版本对不对得上——这些要解析出依赖图才知道，而 lint 故意不建这张图\n（对市场或带版本管理的组件来说这可能意味着联网），留给 up / graph；\nconfigSchema 里 enum、minimum 之类对应的值（平台不校验值，见 docs/zh/11-reference/04-config-schema-spec.md）。\n\n有错误时退出码为 1；只有警告时为 0，加 --strict 则警告也算失败，给 CI 门禁用。"
