cli.fetch.fetch_component_id_version: "fetch <组件ID>[@<版本>]"
cli.fetch.short: "下载组件的产物（API 契约、SDK 等），不装进项目"
cli.fetch.long: "下载一个组件声明的产物文件，但不把它装进本项目。\n\n用于跨项目调用：你要对方的 .proto / openapi.json 来生成客户端，\n但那个服务由别的项目部署，写进 brickkit.yaml 会让平台在你这边再部一份。\n\n不写版本号时取安装源里的最新版本。\n\n产物落到 .brickkit/artifacts/<版本化服务名>/<type>/... ——\n与 brickkit add 下来的完全同一个位置。.brickkit/ 是本机缓存，不进 Git：\n队友在自己机器上执行同一条 fetch 即可；要让契约随项目提交，把需要的文件复制到你自己的目录里。\n\n这条命令只读：不修改 brickkit.yaml，不生成部署文件，不启动任何东西。"
cli.fetch.example: "  brickkit fetch infra/notifier@1.0.0   取指定版本的产物\n  brickkit fetch infra/notifier         取最新版本的产物"
cli.fetch.no_version_given_resolved_to: "🔎 未指定版本，解析到 %[1]s@%[2]s（来自安装源 %[3]s，类型 %[4]s）"
