cli.build.built: "✅ 已构建 %[1]s → %[2]s"
cli.build.k8s_note: "ℹ️  部署目标是 k8s：镜像构建在这台机器上，集群拉不到——推到集群能访问的 registry（本地集群可用 minikube image load / kind load docker-image）"
cli.build.nothing: "✅ 没有需要在本机构建的组件"
cli.upgrade.use: "upgrade [组件ID[@版本]]"
cli.upgrade.short: "升级组件的默认版本，迁移它的配置"
cli.upgrade.long: "移动组件的默认版本，三份文件跟着改：brickkit.yaml 的版本与 requiredBy、部署条目、config/ 的迁移（旧值抄过去，新增的键按默认值，删掉的键留在归档）。还有组件依赖旧版本时旧版本留作兼容版本。升级外壳会换成新外壳编进的那一套成员版本。\n\n使用者改过、默认值也变了的键是冲突：终端里逐条选择；--yes 或没有输入时写成两行重复键，up 在解决之前拒绝启动。不写组件就升级所有有新版本的组件——要么全做，要么一个都不改。"
cli.upgrade.example: "  brickkit upgrade                    # 所有有新版本的组件\n  brickkit upgrade erp/backend        # 升到最新\n  brickkit upgrade erp/backend@2.0.0  # 升到指定版本\n  brickkit upgrade --dry-run          # 只看会发生什么"
