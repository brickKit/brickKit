cli.root.example: "  brickkit init my-project              初始化项目\n  brickkit add erp/backend@1.0.0        添加组件（递归拉取依赖）\n  brickkit up --dry-run                 只算不启动：看这次会跑哪些、什么顺序\n  brickkit up                           生成部署文件并启动\n  brickkit status                       查看运行状态\n  brickkit down                         停止（不删除 volume）"
cli.root.long: "BrickKit CLI —— 像搭积木一样构建系统。\n\n你声明要哪些组件、它们依赖谁，CLI 派生其余一切，交给 Docker、Podman 或 Kubernetes 执行。\n项目由三层文件描述：\n  brickkit.yaml       有哪些组件、什么精确版本\n  deploy.yaml         怎么部署（个人的 deploy.local.yaml 不进 Git）\n  config/             每个组件拿到哪些环境变量\n\nCLI 做的事：\n  1. 拉取组件与产物（Git / 本地目录 / 组件市场），写进三层文件\n  2. 解析依赖、排出启动顺序（强/弱依赖 + 拓扑排序）\n  3. 生成部署文件、执行迁移、调用底层引擎（compose / kubectl）\n  4. 构建本机镜像、发布组件版本（build / release / publish）\n  5. 管理组件源码工作区（--repo / sync）\n\n它不是常驻服务：执行完命令就退出，不占用后台资源。"
cli.add.add_component_id_exact_version: "add [组件ID[@精确版本]]"
cli.build.use: "build [组件ID[@版本]]"
cli.build.short: "构建需要在本机构建的组件镜像"
cli.build.long: "构建需要在本机构建的镜像：没有 deployment.image 的组件，以及本地安装源里的组件（正在开发的代码，镜像必须从它构建）。有 image 的 git / 市场组件是拉取的，不构建。\n\n镜像 tag 与组件的 metadata.version 一致；外壳镜像记下编进去的成员版本，up 用它核对。镜像已存在时跳过，--force 强制重新构建。源码来自本地仓库（正是这个版本时），否则从这个版本的 git tag 导出。\n\nup 从不构建：镜像不在时它报错，提示运行 build。"
cli.build.example: "  brickkit build                      # 构建所有需要本机构建的组件\n  brickkit build erp/backend          # 只构建这个组件\n  brickkit build erp/backend --force  # 改了代码之后重新构建"
cli.build.flag_force: "镜像已存在也重新构建"
cli.build.normally_pulled: "ℹ️  %[1]s 的镜像平常是拉取的（%[2]s），按点名在本机构建一份"
cli.build.skipped_exists: "⏭️  %[1]s：镜像 %[2]s 已存在，跳过（--force 重新构建）"
