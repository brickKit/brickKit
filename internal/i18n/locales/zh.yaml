cli.graph.short: "把项目的依赖拓扑输出成 Mermaid 图"
cli.graph.long: "把当前项目的依赖拓扑画成 Mermaid 图，打印到 stdout。\n\n图上有什么：\n  节点     组件 id@版本；mode: local 的标上\"托管本地\"（写了 localPort 的连端口一起标）\n  实线     强依赖；虚线是弱依赖（取不到的弱依赖画成\"未安装\"节点）\n  置灰     这次不会启动的组件（被 mode: disable 关掉的，以及跟着上层一起不跑的）\n  外壳分组 这次被外壳承载的成员（部署文件里的 members）画在外壳（subgraph）里\n\ngraph 从不读本地模式——它读 deploy.yaml（或 -f 指定的文件），只写在 deploy.local.yaml 里的 mode: debug 不会出现在这里。\n\n边总是画出来，不管对方这次有没有启动——图展示的是声明的结构，\"启动与否\"用节点样式表达。\n\nstdout 里只有 Mermaid，可以直接存成 .mmd 文件（brickkit graph > graph.mmd），\nGitHub 会直接渲染 .mmd / .mermaid 文件；放进 Markdown 时要用 mermaid 代码块围起来\n（围栏语言写 mermaid），光粘一段文字是不会被渲染的。依赖解析产生的警告写到 stderr。\n和 up 一样，还没缓存的市场 / Git 组件会联网取 Manifest；解析不出依赖图时报同样的错误。"
