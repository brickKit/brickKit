cli.init.example: "  brickkit init my-shop                 新建 my-shop/，生成整套骨架\n  brickkit init                         补全当前目录（目录非空时先确认）\n  brickkit init --name my-shop --yes    不询问直接补全（CI 用）\n  brickkit init my-shop --no-skills     不装 AI 助手技能\n  brickkit init --hooks                 只装提交前检查"
cli.init.long: "创建 BrickKit 项目，或把一个项目补全。\n\n两种模式共用同一个补全原语——对照完整项目的文件清单，缺的创建，有的不动：\n  brickkit init <名字>   创建式：新建 <名字>/ 目录并在里面生成整套骨架\n  brickkit init          补全式：当前目录缺什么补什么（已有项目接入，\n                         或组件仓库给自己建一个本地联调工作台）\n\n完整的项目有 brickkit.yaml（用哪些组件、哪个版本）、deploy.yaml（怎么部署）、\nconfig/vars.yaml（公共变量）、components/ 与 shell/ 两个本地源、BRICKKIT.md（项目地图）和 .gitignore。\n这里从不生成 deploy.local.yaml：要用时由 brickkit local on 生成。\n\n补全式：\n  - 已有的文件跳过，一个字节都不动\n  - 已有的 .gitignore 只校验、不修改：缺的每一条必需条目都大声警告\n    （缺了它们，个人部署文件和密钥会被提交）\n  - 目录非空时先打印计划，确认后才执行（--yes 跳过确认）\n  - 项目名取 --name，否则沿用已有 brickkit.yaml 的 project，否则取目录名\n  - 最后按 lint 与 up 的方式装载一遍项目；装载失败，命令就失败\n\n项目名只能用小写字母、数字和中划线，以字母或数字开头结尾\n（它会成为 K8s namespace 与 Docker 网络的名字）。\n\n同时装入 AI 助手技能（.claude/skills/、AGENTS.md）；不要的话加 --no-skills。\n不会碰你的 CLAUDE.md。\n\n项目根就是 Git 仓库根时，顺带装上提交前检查；\n嵌在别人仓库里的项目，用 brickkit init --hooks 显式安装。"
