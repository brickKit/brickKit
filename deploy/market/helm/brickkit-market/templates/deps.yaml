{{- if .Values.deps.enabled }}
# 集群内的 PostgreSQL 与对象存储 —— **仅供评估与自建**。
#
# 生产环境请用云托管实例：备份、主从、版本升级这些事，一个 StatefulSet 替不了。
# 放在这里只为一件事：让人能一条命令把市场跑起来看看。
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "market.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None          # Headless：StatefulSet 的稳定 DNS 名
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    app.kubernetes.io/name: postgres
    {{- include "market.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        {{- include "market.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        # postgres 镜像以 uid 999 运行，数据卷属主要跟着改，
        # 否则会以 "could not create lock file" 反复重启
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.deps.postgres.image | quote }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "market.secretName" . }}
                  key: DATABASE_PASSWORD
            # 数据放子目录：卷根目录上有 lost+found 时 initdb 会拒绝初始化
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.deps.postgres.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.deps.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    app.kubernetes.io/name: rustfs
    {{- include "market.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-rustfs
  labels:
    app.kubernetes.io/name: rustfs
    {{- include "market.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: {{ .Release.Name }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        {{- include "market.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: {{ .Values.deps.rustfs.image | quote }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "market.secretName" . }}
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "market.secretName" . }}
                  key: RUSTFS_SECRET_KEY
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.deps.rustfs.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.deps.rustfs.storage }}
{{- end }}
