{{- if not .Values.auth.existingSecret }}
# 口令 Secret。只有在没给 auth.existingSecret 时才生成。
#
# ⚠️ 这些值会进 Helm 的 release 记录（存在集群的 Secret 里）。
# 生产环境请改用 auth.existingSecret，由你自己创建与轮换。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "market.fullname" . }}-secrets
  labels:
    {{- include "market.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.auth.databasePassword | quote }}
  RUSTFS_ACCESS_KEY: {{ .Values.auth.rustfsAccessKey | quote }}
  RUSTFS_SECRET_KEY: {{ .Values.auth.rustfsSecretKey | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
{{- end }}
