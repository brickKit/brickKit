# BrickKit Market 单机部署（运维指南 §4.4）。
#
# 用法：
#   cp .env.example .env && vi .env      # 填口令
#   docker compose up -d
#   curl http://localhost:8080/api/v1/health
#
# 端口全部可通过 .env 覆盖，方便在已经占用 5432/9000 的机器上起一套。
# 数据落在 ./data/ 下（bind mount），备份就是打包这个目录。

services:
  # ===== PostgreSQL：组件元数据、版本、用户、访问策略 =====
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    # 默认不发布到宿主机：数据库只该被市场访问（运维指南 §2.3）。
    # 需要用 psql 直连排障时再取消注释。
    # ports:
    #   - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - market-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== 数据目录初始化（一次性）=====
  # RustFS 容器内以 uid 10001 运行，而 bind mount 出来的宿主机目录默认属 root，
  # 直接起会 "Permission denied (os error 13)" 反复重启。
  # 用一个一次性容器把属主改对，`docker compose up -d` 在新机器上就能一把起来。
  rustfs-init:
    image: busybox:1.36
    user: root
    volumes:
      - ./data/rustfs:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data && chmod 755 /data"]
    networks:
      - market-net

  # ===== RustFS：S3 兼容对象存储，存放 artifacts =====
  # 换成任何 S3 兼容服务（Ceph / S3 本体）只需要改这一段与 RUSTFS_ENDPOINT，
  # 市场只依赖 S3 协议本身。
  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
    volumes:
      - ./data/rustfs:/data
    ports:
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"    # 管理界面（可选）
    networks:
      - market-net
    restart: unless-stopped

  # ===== BrickKit Market API =====
  market-api:
    image: ${MARKET_IMAGE:-brickkit/market-server:dev}
    # 本地开发可直接从源码构建：docker compose up -d --build
    build:
      context: ../../market-server
      args:
        VERSION: ${MARKET_VERSION:-dev}
    ports:
      - "${MARKET_PORT:-8080}:8080"
    environment:
      # 数据库
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # 对象存储（S3 兼容）
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-brickkit-artifacts}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      # 令牌有效期（小时）。令牌是存库的不透明串，不是 JWT，可即时吊销
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-720}
      # 管理员：首次启动自动创建；已存在时只补管理员权限，不覆盖口令
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 忘记管理员口令时临时置 true，重启一次后改回 false（运维指南 §9 Q5）
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    networks:
      - market-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      # 建库表、建 bucket 都在启动时做，给足首次启动的时间
      start_period: 30s
    restart: unless-stopped

networks:
  market-net:
    name: brickkit-market-net
    driver: bridge
