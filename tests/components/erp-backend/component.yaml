# erp/backend —— 连接组件（BrickKit Phase 5 测试组件）
#
# 它是整条依赖链的汇合点：自己几乎没有数据，价值全在"把别的组件正确地串起来"。
#
# 三件它独有的验证点：
#   - **弱依赖降级**：事件总线缺席或调用失败时，审批照常成功、状态照常改变
#   - **extraPorts 注入**：people/basic 的 gRPC 在 9090，平台额外注入
#     PEOPLE_BASIC_GRPC_ENDPOINT
#   - **没有外部系统**：只依赖组件，不需要任何数据库或缓存
apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/backend
  name: ERP 后端
  version: 1.0.0
  description: Order queries and approvals; authentication, authorisation and people data come from three upstream components, and approval events go to the event bus
  vendor: brickkit-platform
  license: MIT

tags:
  - erp
  - connector

artifacts:
  - type: api-docs
    format: openapi
    description: HTTP REST API documentation
    files:
      - openapi.json

dependencies:
  components:
    # 强依赖：注入 PEOPLE_BASIC_ENDPOINT（HTTP，8080）
    # 与 PEOPLE_BASIC_GRPC_ENDPOINT（gRPC，来自它声明的 extraPorts，9090）。
    # 本组件用的是后者
    - people/basic@1.0.0
    # 强依赖：注入 AUTH_PASSWORD_LOGIN_ENDPOINT
    - auth/password-login@1.0.0
    # 强依赖：注入 AUTHORIZATION_RBAC_ENDPOINT（gRPC 与 HTTP 共用主端口）
    - authorization/rbac@1.0.0
    # **弱依赖**：没装它时平台完全不注入 INFRA_REDIS_EVENT_BUS_ENDPOINT，
    # 本组件据此降级——审批照常成功，只是不发事件
    - id: infra/redis-event-bus@1.0.0
      optional: true
  # 不需要数据库：连接组件不掌握主数据，订单是内置的样例数据。
  # 声明一组用不上的 DATABASE_* 会让使用者白建一个库、还要为它填口令

configSchema:
  type: object
  properties:
    LOG_LEVEL:
      type: string
      default: "info"
      description: Log level (debug | info | warn | error)
    SESSION_TTL_SECONDS:
      type: integer
      default: 3600
      description: Session length (seconds)

# 没有 migration：没有自己的库，也就没有自己的表

deployment:
  type: container
  image: brickkit-demo/erp-backend:1.0.0
  port: 8080
  resources:
    # 只声明 requests，不声明 limits：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "100m"
      memory: "128Mi"

healthCheck:
  type: http
  path: /healthz
  # ⚠️ 只检查本进程存活，**不逐个探测四个依赖**。
  # 逐个探的话，任意一个依赖抖动都会让这个本身完全正常的容器被杀掉重启
