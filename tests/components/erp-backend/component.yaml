# erp/backend —— 连接组件（BrickKit Phase 5 测试组件）
#
# 它是整条依赖链的汇合点：自己几乎没有数据，价值全在"把别的组件正确地串起来"。
#
# 三件它独有的验证点：
#   - **弱依赖降级**：事件总线缺席或调用失败时，审批照常成功、状态照常改变
#   - **extraPorts 注入**：people/basic 的 gRPC 在 9090，平台额外注入
#     PEOPLE_BASIC_GRPC_ENDPOINT
#   - **没有资源依赖**：只依赖组件，不绑定任何 database / cache
apiVersion: brickkit/v1
kind: Component

metadata:
  id: erp/backend
  name: ERP 后端
  version: 1.0.0
  description: 订单查询与审批；认证、授权、人员信息分别来自三个上游组件，审批事件发往事件总线
  vendor: brickkit-platform
  license: MIT

tags:
  - erp
  - connector

artifacts:
  - type: api-docs
    format: openapi
    description: HTTP REST API 文档
    files:
      - openapi.json

dependencies:
  components:
    # 强依赖：注入 PEOPLE_BASIC_ENDPOINT（HTTP，8080）
    # 与 PEOPLE_BASIC_GRPC_ENDPOINT（gRPC，来自它声明的 extraPorts，9090）。
    # 本组件用的是后者
    - people/basic@1.0.0
    # 强依赖：注入 AUTH_PASSWORD_LOGIN_ENDPOINT
    - auth/password-login@1.0.0
    # 强依赖：注入 AUTHORIZATION_RBAC_ENDPOINT（gRPC 与 HTTP 共用主端口）
    - authorization/rbac@1.0.0
    # **弱依赖**：没装它时平台完全不注入 INFRA_REDIS_EVENT_BUS_ENDPOINT，
    # 本组件据此降级——审批照常成功，只是不发事件（003 §4.3）
    - id: infra/redis-event-bus@1.0.0
      optional: true
  # 没有 resources：连接组件不掌握主数据，订单是内置的样例数据。
  # 声明一个用不上的 database 会让使用者白建一个库、还要为它填口令

configSchema:
  type: object
  properties:
    logLevel:
      type: string
      default: "info"
      description: 日志级别，注入为环境变量 LOG_LEVEL（debug | info | warn | error）
    sessionTtlSeconds:
      type: integer
      default: 3600
      description: 会话时长（秒），注入为环境变量 SESSION_TTL_SECONDS

# 没有 migration：不绑定资源，也就没有自己的表

deployment:
  type: container
  image: brickkit-demo/erp-backend:1.0.0
  port: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

healthCheck:
  type: http
  path: /healthz
  # ⚠️ 只检查本进程存活，**不逐个探测四个依赖**（002 §9.4、开发计划 25.7）。
  # 逐个探的话，任意一个依赖抖动都会让这个本身完全正常的容器被杀掉重启

observability:
  metrics: false
  tracing: false
