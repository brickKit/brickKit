# authorization/rbac —— 授权组件（BrickKit Phase 5 测试组件）
#
# 它验证的是前面几个组件都没覆盖的两件事：
#   - **可选的 Redis**：一个"有了更快、没有也能跑"的外部系统（REDIS_* 配置项不填就不用）
#   - 单端口双协议 + 强依赖 + 缓存三者叠在一起时的降级行为
#
# 权限来自两条路径的并集：直接授予这个人的角色 + 授予其所在**部门**的角色。
# 第二条是它强依赖 people/basic 的原因——部门在那边。
apiVersion: brickkit/v1
kind: Component

metadata:
  id: authorization/rbac
  name: 基于角色的授权
  version: 1.0.0
  description: 回答"某个人能不能做某件事"；权限按人与部门两条路径合并，结果缓存在 Redis
  vendor: brickkit-platform
  license: MIT

tags:
  - authorization
  - rbac

artifacts:
  # 契约即产物：调用方据此生成 gRPC 客户端
  - type: api-contract
    format: protobuf
    description: gRPC API 契约文件
    files:
      - proto/authorization/v1/authorization.proto
  - type: api-docs
    format: openapi
    description: HTTP REST API 文档
    files:
      - openapi.json

dependencies:
  components:
    # 强依赖：地址注入为 PEOPLE_BASIC_ENDPOINT。
    # 部门从这里取；它不可用且缓存未命中时本组件如实报 503，**不做部分降级**
    - people/basic@1.0.0

configSchema:
  type: object
  properties:
    LOG_LEVEL:
      type: string
      default: "info"
      description: 日志级别（debug | info | warn | error）
    CACHE_TTL_SECONDS:
      type: integer
      default: 300
      description: 权限缓存有效期（秒）
    # 数据库连接：configSchema 的键就是环境变量名，值由使用者写在项目的 config/ 里。
    # 库由使用者建好；表由本组件的迁移建
    DATABASE_HOST:
      type: string
      description: PostgreSQL 主机名
    DATABASE_PORT:
      type: integer
      default: 5432
      description: PostgreSQL 端口
    DATABASE_NAME:
      type: string
      description: 库名
    DATABASE_USER:
      type: string
      description: 连接用户
    DATABASE_PASSWORD:
      type: string
      secret: true
      description: 连接口令。写成 ${VAR} 或 file:// 引用，不要把明文写进 config/
    # Redis 连接。它是加速器不是数据源：不配时组件照样能跑，只是每次都回源
    REDIS_HOST:
      type: string
      description: Redis 主机名
    REDIS_PORT:
      type: integer
      default: 6379
      description: Redis 端口
    REDIS_PASSWORD:
      type: string
      secret: true
      description: Redis 口令；没设口令的 Redis 不写这一项
  required: [DATABASE_HOST, DATABASE_NAME, DATABASE_USER]

migration:
  command: ["/app/authorization-rbac", "migrate"]

deployment:
  type: container
  image: brickkit-demo/authorization-rbac:1.0.0
  # HTTP 与 gRPC 共用这一个端口（h2c + Content-Type 分流，同 department/tree）
  port: 8080
  resources:
    # 只声明 requests，不声明 limits：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "100m"
      memory: "128Mi"

healthCheck:
  type: http
  path: /healthz
  # ⚠️ 只检查本进程存活，**不碰 Redis**、不查库、不调 people/basic。
  # Redis 一抖就把所有副本杀掉重启，而它只是个加速器
