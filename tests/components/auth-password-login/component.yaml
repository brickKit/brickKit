# auth/password-login —— 口令登录组件（BrickKit Phase 5 测试组件）
#
# 它验证的是前两个组件都没覆盖的一类形态：**强依赖别人、自己却没有可展示数据
# 的组件**。它的全部价值在于"依赖正常/异常时能不能给出正确的判断"。
#
# 职责边界：本组件只管"怎么证明你是你"（用户名 → 口令哈希 → 令牌），
# "你是谁"（姓名、部门）在 people/basic 里，登录时现取。
# 分开之后，员工从人员系统消失就登录不进来——主体的存废由人员系统说了算。
apiVersion: brickkit/v1
kind: Component

metadata:
  id: auth/password-login
  name: 口令登录
  version: 1.0.0
  description: 校验用户名与口令并签发 JWT；身份信息来自 people/basic，不在本组件重复存储
  vendor: brickkit-platform
  license: MIT

tags:
  - auth
  - identity

artifacts:
  # 本组件只提供 HTTP，没有 gRPC，因此没有 proto 契约（002 §7：有什么发什么）
  - type: api-docs
    format: openapi
    description: HTTP REST API 文档
    files:
      - openapi.json

dependencies:
  components:
    # 强依赖：地址注入为 PEOPLE_BASIC_ENDPOINT。
    # 登录时用它确认主体仍然存在；它不可用时本组件如实报 503（不是 401）
    - people/basic@1.0.0

configSchema:
  type: object
  properties:
    LOG_LEVEL:
      type: string
      default: "info"
      description: 日志级别（debug | info | warn | error）
    TOKEN_TTL_SECONDS:
      type: integer
      default: 1800
      description: 令牌有效期（秒）
    JWT_SECRET:
      type: string
      secret: true
      # **故意没有 default，而且必填**：有默认值就意味着所有装了这个组件的人共用同一把
      # 钥匙，任何人都能给任何一处部署签出管理员令牌，而且看起来一切正常。
      # 必填让 up 在启动之前就点名缺它，而不是等组件起来再失败
      description: JWT 签名密钥，至少 32 字节。写成 ${JWT_SECRET} 或 file:// 引用，不要把明文写进 config/
    # 数据库连接：configSchema 的键就是环境变量名，值由使用者写在项目的 config/ 里。
    # 库由使用者建好；表由本组件的迁移建
    DATABASE_HOST:
      type: string
      description: PostgreSQL 主机名
    DATABASE_PORT:
      type: integer
      default: 5432
      description: PostgreSQL 端口
    DATABASE_NAME:
      type: string
      description: 库名
    DATABASE_USER:
      type: string
      description: 连接用户
    DATABASE_PASSWORD:
      type: string
      secret: true
      description: 连接口令。写成 ${VAR} 或 file:// 引用，不要把明文写进 config/
  required: [JWT_SECRET, DATABASE_HOST, DATABASE_NAME, DATABASE_USER]

migration:
  command: ["/app/auth-password-login", "migrate"]

deployment:
  type: container
  image: brickkit-demo/auth-password-login:1.0.0
  port: 8080
  resources:
    # 只声明 requests，不声明 limits（002 §4.6）：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "100m"
      memory: "128Mi"

healthCheck:
  type: http
  path: /healthz
  # ⚠️ 只检查本进程存活，不查数据库、不调 people/basic（002 §9.4）。
  # 否则依赖一抖，编排系统就会把这个本身完全正常的容器杀掉重启
