# department/tree —— 部门树组件（BrickKit Phase 5 测试组件）
#
# 叶子组件：不依赖任何其他组件，只需要一个 PostgreSQL（DATABASE_* 配置项）。
# 同时是平台的验证夹具：单端口双协议、gRPC Reflection、migration、artifacts。
apiVersion: brickkit/v1
kind: Component

metadata:
  id: department/tree
  name: 部门树
  version: 1.0.0
  description: 提供组织架构（部门树）的查询能力，HTTP 与 gRPC 双协议共用同一端口
  vendor: brickkit-platform
  license: MIT

tags:
  - department
  - master-data

artifacts:
  # 契约即产物：使用方 brickkit add 之后据此生成 gRPC 客户端
  - type: api-contract
    format: protobuf
    description: gRPC API 契约文件
    files:
      - proto/department/v1/department.proto
  - type: api-docs
    format: openapi
    description: HTTP REST API 文档
    files:
      - openapi.json

configSchema:
  type: object
  properties:
    LOG_LEVEL:
      type: string
      default: "info"
      description: 日志级别（debug | info | warn | error）
    # 数据库连接：configSchema 的键就是环境变量名，值由使用者写在项目的 config/ 里。
    # 库由使用者建好；表由本组件的迁移建
    DATABASE_HOST:
      type: string
      description: PostgreSQL 主机名
    DATABASE_PORT:
      type: integer
      default: 5432
      description: PostgreSQL 端口
    DATABASE_NAME:
      type: string
      description: 库名
    DATABASE_USER:
      type: string
      description: 连接用户
    DATABASE_PASSWORD:
      type: string
      secret: true
      description: 连接口令。写成 ${VAR} 或 file:// 引用，不要把明文写进 config/
  required: [DATABASE_HOST, DATABASE_NAME, DATABASE_USER]

migration:
  # 平台在启动组件之前执行一次；必须幂等
  command: ["/app/department-tree", "migrate"]

deployment:
  type: container
  image: brickkit-demo/department-tree:1.0.0
  # 单端口：HTTP 与 gRPC 共用。因此不需要 extraPorts
  port: 8080
  resources:
    # 只声明 requests，不声明 limits：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "50m"
      memory: "32Mi"

healthCheck:
  type: http
  path: /healthz
  # ⚠️ /healthz 只检查本进程存活，不查数据库
