# people/basic —— 人员组件（BrickKit Phase 5 测试组件）
#
# 连接组件的雏形：有自己的数据（人员），强依赖 department/tree 补全部门名，
# 弱依赖 infra/redis-event-bus 发事件。
# 同时是平台的验证夹具：extraPorts 双端口、跨语言（Python 客户端调 Go 服务端）、
# 强依赖与弱依赖在故障时的不同表现。
apiVersion: brickkit/v1
kind: Component

metadata:
  id: people/basic
  name: 基础人员
  version: 1.0.0
  description: 提供人员查询能力；部门名来自 department/tree，不在本组件重复存储
  vendor: brickkit-platform
  license: MIT

tags:
  - people
  - master-data

artifacts:
  # 契约即产物：调用方据此生成 gRPC 客户端
  - type: api-contract
    format: protobuf
    description: gRPC API 契约文件
    files:
      - proto/people/v1/people.proto
  - type: api-docs
    format: openapi
    description: HTTP REST API 文档（FastAPI 自动生成）
    files:
      - openapi.json

dependencies:
  components:
    # 强依赖：地址注入为 DEPARTMENT_TREE_ENDPOINT；不可用时本组件如实报 503
    - department/tree@1.0.0
    # 弱依赖：缺失时平台完全不注入 INFRA_REDIS_EVENT_BUS_ENDPOINT，组件自行降级
    - id: infra/redis-event-bus@1.0.0
      optional: true

configSchema:
  type: object
  properties:
    LOG_LEVEL:
      type: string
      default: "info"
      description: 日志级别（debug | info | warn | error）
    # 数据库连接：configSchema 的键就是环境变量名，值由使用者写在项目的 config/ 里。
    # 库由使用者建好；表由本组件的迁移建
    DATABASE_HOST:
      type: string
      description: PostgreSQL 主机名
    DATABASE_PORT:
      type: integer
      default: 5432
      description: PostgreSQL 端口
    DATABASE_NAME:
      type: string
      description: 库名
    DATABASE_USER:
      type: string
      description: 连接用户
    DATABASE_PASSWORD:
      type: string
      secret: true
      description: 连接口令。写成 ${VAR} 或 file:// 引用，不要把明文写进 config/
  required: [DATABASE_HOST, DATABASE_NAME, DATABASE_USER]

migration:
  command: ["python", "-m", "app.main", "migrate"]

deployment:
  type: container
  image: brickkit-demo/people-basic:1.0.0
  # 主端口（HTTP）：健康检查与 PEOPLE_BASIC_ENDPOINT 用它
  port: 8080
  # 额外端口（gRPC）：Python 的 grpcio 不能与 HTTP 共用端口。
  # 平台据此注入 PEOPLE_BASIC_GRPC_ENDPOINT
  extraPorts:
    - name: grpc
      port: 9090
  resources:
    # 只声明 requests，不声明 limits：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "100m"
      memory: "128Mi"

healthCheck:
  type: http
  path: /healthz
  # ⚠️ 只检查本进程存活，不查数据库、不调 department/tree
