# demo/hello —— BrickKit 平台自测组件
# 它不是业务组件，而是平台自己的测试夹具：让环境变量注入、部署文件生成、
# 健康检查、多版本共存这些能力有真实容器可验证。
apiVersion: brickkit/v1
kind: Component

metadata:
  id: demo/hello
  name: Platform self-test component hello
  version: 1.0.0
  description: The smallest HTTP component for BrickKit's own self-tests; serves a greeting and echoes its environment variables
  vendor: brickkit-platform
  license: MIT

tags:
  - demo
  - platform-test

artifacts:
  - type: api-docs
    format: openapi
    description: HTTP API docs
    files:
      - openapi.json

configSchema:
  type: object
  properties:
    greeting:
      type: string
      default: "Hello"
      description: The greeting, injected as the environment variable GREETING

deployment:
  type: container
  image: brickkit-demo/hello:1.0.0
  port: 8080
  resources:
    # 只声明 requests，不声明 limits（002 §4.6）：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "50m"
      memory: "32Mi"

healthCheck:
  type: http
  path: /healthz
