# demo/caller —— BrickKit 平台自测组件
# 覆盖强依赖注入、弱依赖降级、配置注入与迁移执行四条平台承诺。
apiVersion: brickkit/v1
kind: Component

metadata:
  id: demo/caller
  name: Platform self-test component caller
  version: 1.0.0
  description: The caller component for BrickKit's own self-tests; verifies dependency address injection and optional-dependency degradation
  vendor: brickkit-platform
  license: MIT

tags:
  - demo
  - platform-test

artifacts:
  - type: api-docs
    format: openapi
    description: HTTP API docs
    files:
      - openapi.json

dependencies:
  components:
    # 强依赖：地址注入为 DEMO_HELLO_ENDPOINT
    - demo/hello@1.0.0
    # 弱依赖：缺失时平台完全不注入 DEMO_BUS_ENDPOINT，组件自行降级
    - id: demo/bus@1.0.0
      optional: true

configSchema:
  type: object
  properties:
    # 可选的数据库：配了 DATABASE_HOST，组件就验证它确实连得上
    DATABASE_HOST:
      type: string
      description: PostgreSQL 主机名
    DATABASE_PORT:
      type: integer
      default: 5432
      description: PostgreSQL 端口
    DATABASE_NAME:
      type: string
      description: 库名
    DATABASE_USER:
      type: string
      description: 连接用户
    MIGRATION_SHOULD_FAIL:
      type: string
      description: 测试用开关：设为 "1" 时迁移以非零退出，用来验证迁移失败会挡住主服务

migration:
  command: ["/app/caller", "migrate"]

deployment:
  type: container
  image: brickkit-demo/caller:1.0.0
  port: 8080
  resources:
    # 只声明 requests，不声明 limits：
    # 组件知道自己稳态占多少，而"允许它涨到多少"是部署方的判断。
    # 而且逐字段合并意味着这里写了 limits.cpu，用它的项目就删不掉了
    requests:
      cpu: "50m"
      memory: "32Mi"

healthCheck:
  type: http
  path: /healthz
